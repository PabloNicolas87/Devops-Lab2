name: CI/CD – Build & Deploy to AWS ECS

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: latest
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      ECR_REPOSITORY_NAME: proyectobase-runtime
      DOCKER_RUNTIME_REPO: proyectobase-runtime2
      DOCKER_BUILDER_REPO: proyectobase-builder2

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔖 Determine version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔨 Build & Push BUILDER image (Docker Hub Only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: builder
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_BUILDER_REPO }}:${{ github.run_number }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_BUILDER_REPO }}:latest

      - name: ⚙️ Build & Push RUNTIME image (Dual Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_RUNTIME_REPO }}:${{ github.run_number }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_RUNTIME_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ github.run_number }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest

      - name: 🧹 Clean up dangling images
        run: docker image prune -f

      - name: 🔍 Get image digest from ECR
        id: ecr-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY_NAME }} \
            --image-ids imageTag=${{ github.run_number }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}@${DIGEST}"
          # Export for subsequent shell steps
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          # Also expose as a step output so later steps can reference it as an outputs variable
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Usando imagen con digest: $IMAGE_URI"

      - name: 🧩 Replace image URI in task definition
        run: |
          # Replace using the explicit step output from ecr-digest to avoid race conditions
          sed "s|<IMAGE_URI>|${{ steps.ecr-digest.outputs.image_uri }}|" task-definition-template.json > task-definition.json

      - name: 🧾 Debug generated task definition
        run: cat task-definition.json

      - name: 📝 Register new Task Definition
        id: register-task
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          # Export both to the shell env and as a step output for reliable consumption by later steps
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: 🚀 Update ECS Service to new Task Definition
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task.outputs.task_arn }} \
            --region ${{ secrets.AWS_REGION }} \
            --force-new-deployment

      - name: 🔎 Validate registered task definition
        run: |
          echo "Inspecting registered task definition: ${{ steps.register-task.outputs.task_arn }}"
          aws ecs describe-task-definition --task-definition ${{ steps.register-task.outputs.task_arn }} --query 'taskDefinition.{family:family,revision:revision,containerDefinitions:containerDefinitions}' --output json

      - name: ⏳ Wait for service to stabilize
        run: |
          echo "Waiting for ECS service to become stable..."
          aws ecs wait services-stable --cluster ${{ secrets.ECS_CLUSTER_NAME }} --services ${{ secrets.ECS_SERVICE_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: 📊 Check service tasks (summary)
        run: |
          aws ecs list-tasks --cluster ${{ secrets.ECS_CLUSTER_NAME }} --service-name ${{ secrets.ECS_SERVICE_NAME }} --desired-status RUNNING --output json
