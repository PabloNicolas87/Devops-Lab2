name: CI/CD – Build & Deploy Lab2 to AWS ECS

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 🌎 Variables generales (no sensibles)
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
      DOCKER_RUNTIME_REPO: ${{ vars.DOCKER_RUNTIME_REPO }}
      DOCKER_BUILDER_REPO: ${{ vars.DOCKER_BUILDER_REPO }}
      VERSION: ${{ vars.VERSION }}

      # 🔒 Secrets sensibles
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔖 Determine version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ env.VERSION }}" >> $GITHUB_ENV
          fi

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🔨 Build & Push BUILDER image (Docker Hub)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: builder
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_BUILDER_REPO }}:${{ github.run_number }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_BUILDER_REPO }}:latest

      - name: ⚙️ Build & Push RUNTIME image (Dual Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_RUNTIME_REPO }}:${{ github.run_number }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_RUNTIME_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ github.run_number }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest

      - name: 🧹 Clean up dangling images
        run: docker image prune -f

      - name: 🔍 Get image digest from ECR
        id: ecr-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY_NAME }} \
            --image-ids imageTag=${{ github.run_number }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}@${DIGEST}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Usando imagen con digest: $IMAGE_URI"

      - name: 🧩 Replace image URI in task definition
        run: |
          sed "s|<IMAGE_URI>|${{ steps.ecr-digest.outputs.image_uri }}|" task-definition-template.json > task-definition.json

      - name: 🧾 Debug generated task definition
        run: cat task-definition.json

      - name: 📝 Register new Task Definition
        id: register-task
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: 🚀 Update ECS Service to new Task Definition
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service ${{ env.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task.outputs.task_arn }} \
            --region ${{ env.AWS_REGION }} \
            --force-new-deployment

      - name: ⏳ Wait for service to stabilize
        run: |
          echo "Waiting for ECS service to become stable..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: 📊 Check service tasks (summary)
        run: |
          aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service-name ${{ env.ECS_SERVICE_NAME }} \
            --desired-status RUNNING \
            --output json
